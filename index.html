<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Sustituciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F3EA; --paper-2:#FFFFFF; --ink:#1F2B24; --ink-soft:#5B6B60;
    --line:#DCD4C1; --forest:#2C4A3B; --forest-2:#1D3329; --gold:#C79A3C;
    --gold-soft:#EFDFB4; --coral:#BE5B4D; --free-1:#8FA68C; --free-2:#5C8562; --free-3:#2C4A3B;
    --amber:#B8823A;
    --shadow: 0 1px 2px rgba(31,43,36,.06), 0 8px 24px -12px rgba(31,43,36,.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;padding:28px 20px 60px;}
  .wrap{max-width:1080px;margin:0 auto;}

  .masthead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2.5px solid var(--ink);padding-bottom:16px;margin-bottom:24px;gap:16px;flex-wrap:wrap;}
  .masthead h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(26px,4vw,36px);margin:0;letter-spacing:-.01em;line-height:1.05;}
  .masthead .subtitle{font-size:12.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;margin-top:6px;font-weight:600;}
  .masthead .today{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-soft);text-align:right;text-transform:capitalize;}

  .controls{background:var(--paper-2);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px;}
  .controls-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:16px;}
  @media(max-width:700px){.controls-grid{grid-template-columns:1fr;}}
  .field label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft);font-weight:700;margin-bottom:8px;}
  .select-wrap{position:relative;}
  select, input[type=text]{width:100%;font-family:'Inter',sans-serif;font-size:15px;font-weight:600;padding:12px 14px;border:1.5px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);appearance:none;cursor:pointer;}
  select:focus, input:focus{outline:2px solid var(--forest);outline-offset:1px;}
  .select-wrap::after{content:"⌄";position:absolute;right:14px;top:50%;transform:translateY(-58%);pointer-events:none;color:var(--ink-soft);font-size:18px;}

  .day-tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .day-tab{flex:1;min-width:78px;padding:11px 6px;text-align:center;border:1.5px solid var(--line);border-radius:9px;background:var(--paper);font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:.12s;}
  .day-tab:hover{border-color:var(--forest);}
  .day-tab.active{background:var(--forest);border-color:var(--forest);color:#fff;}

  .add-row{display:flex;gap:10px;align-items:flex-end;}
  .add-row .field{flex:1;margin-bottom:0;}
  .add-row .field label{margin-bottom:8px;}
  .btn{border:none;border-radius:9px;padding:11px 18px;font-size:13.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;}
  .btn-primary{background:var(--forest);color:#fff;}
  .btn-primary:hover{background:var(--forest-2);}
  .btn-secondary{background:var(--paper-2);color:var(--ink);border:1.5px solid var(--line);}
  .btn-secondary:hover{border-color:var(--forest);}
  .btn-gold{background:var(--gold);color:#3A2C0E;}
  .btn-gold:hover{background:#B68B2E;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .chip{display:flex;align-items:center;gap:8px;background:var(--forest);color:#fff;border-radius:20px;padding:7px 8px 7px 14px;font-size:13px;font-weight:600;}
  .chip .x{cursor:pointer;background:rgba(255,255,255,.18);width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;}
  .chip .x:hover{background:rgba(255,255,255,.32);}
  .chip .cov{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--gold-soft);}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0;}

  .empty{text-align:center;padding:70px 20px;color:var(--ink-soft);}
  .empty .glyph{font-family:'Fraunces',serif;font-size:44px;color:var(--gold);margin-bottom:10px;}
  .empty p{font-size:14.5px;max-width:380px;margin:6px auto 0;}

  .teacher-block{background:var(--paper-2);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden;box-shadow:var(--shadow);}
  .teacher-block-head{background:var(--forest);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  .teacher-block-head .name{font-family:'Fraunces',serif;font-weight:600;font-size:19px;}
  .teacher-block-head .meta{font-size:12px;color:var(--gold-soft);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
  .teacher-block-head .stat{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:700;background:rgba(255,255,255,.14);padding:6px 12px;border-radius:20px;}

  .periods{display:flex;flex-direction:column;gap:0;padding:8px;}
  .period-row{border-bottom:1px solid var(--line);}
  .period-row:last-child{border-bottom:none;}
  .period-row.assigned .period-num{background:var(--forest);color:#fff;}
  .period-head{display:flex;align-items:center;gap:14px;padding:13px 10px;cursor:pointer;}
  .period-num{font-family:'Fraunces',serif;font-weight:600;font-size:18px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--gold-soft);color:var(--forest-2);flex-shrink:0;}
  .period-time{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-soft);width:88px;flex-shrink:0;}
  .period-info{flex:1;min-width:0;}
  .period-info .subj{font-weight:700;font-size:14.5px;}
  .period-info .subj .dbl{font-size:10.5px;font-weight:700;color:var(--amber);border:1px solid var(--amber);border-radius:10px;padding:1px 7px;margin-left:7px;vertical-align:middle;text-transform:uppercase;letter-spacing:.03em;}
  .period-info .cls{font-size:12px;color:var(--ink-soft);}
  .free-badge{font-size:11.5px;font-weight:700;color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:5px 11px;flex-shrink:0;white-space:nowrap;}
  .free-badge.pending{color:var(--coral);border-color:var(--coral);}
  .free-badge.assigned{color:var(--forest);border-color:var(--forest);background:#EEF4EF;}
  .chevron{color:var(--ink-soft);transition:.15s;flex-shrink:0;font-size:14px;}
  .period-row.open .chevron{transform:rotate(180deg);}
  .period-row.free .period-head{background:#FAFBF7;}
  .period-row.free .period-info .subj{color:var(--free-2);}

  .sub-panel{display:none;padding:12px 10px 16px 56px;background:#FCFAF4;}
  .period-row.open .sub-panel{display:block;}
  .sub-panel h4{margin:0 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:700;}
  .sub-list{display:flex;flex-direction:column;gap:7px;}
  .sub-item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 9px 9px 12px;}
  .sub-item.picked{border-color:var(--forest);background:#EEF4EF;}
  .sub-item.used-elsewhere{opacity:.72;}
  .sub-rank{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);width:16px;flex-shrink:0;}
  .sub-name{font-weight:600;font-size:13.5px;flex:1;min-width:0;}
  .used-tag{font-size:10px;color:var(--amber);font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-left:6px;}
  .avail-track{width:52px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex-shrink:0;}
  .avail-fill{height:100%;border-radius:3px;}
  .avail-count{font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;width:54px;text-align:right;flex-shrink:0;color:var(--ink-soft);}
  .pick-btn{flex-shrink:0;border:none;border-radius:7px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;background:var(--forest);color:#fff;}
  .pick-btn:hover{background:var(--forest-2);}
  .pick-btn.remove{background:transparent;color:var(--coral);border:1.5px solid var(--coral);}
  .no-subs{font-size:13px;color:var(--coral);font-weight:600;padding:6px 2px;}
  .recess-row{text-align:center;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;padding:6px 0;}

  .section-divider{display:flex;align-items:center;gap:12px;margin:34px 0 16px;}
  .section-divider h2{font-family:'Fraunces',serif;font-weight:600;font-size:20px;margin:0;white-space:nowrap;}
  .section-divider .line{flex:1;height:1px;background:var(--line);}

  .export-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .individual-picker{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px;background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
  .individual-picker label{font-size:12.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;}
  .individual-picker select{max-width:260px;padding:9px 12px;font-size:14px;}

  #planCard{background:var(--paper-2);border:1px solid var(--line);border-radius:16px;padding:28px 30px;box-shadow:var(--shadow);}
  #planCard .p-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:20px;gap:14px;flex-wrap:wrap;}
  #planCard .p-title{font-family:'Fraunces',serif;font-weight:600;font-size:23px;}
  #planCard .p-sub{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft);font-weight:700;margin-top:5px;}
  #planCard .p-badge{background:var(--coral);color:#fff;font-size:11.5px;font-weight:700;padding:6px 13px;border-radius:20px;text-transform:uppercase;letter-spacing:.05em;}
  #planCard .p-badge.ok{background:var(--forest);}
  .p-teacher-section{margin-bottom:20px;}
  .p-teacher-section:last-child{margin-bottom:0;}
  .p-teacher-name{font-family:'Fraunces',serif;font-weight:600;font-size:16px;color:var(--forest);margin-bottom:8px;padding-bottom:6px;border-bottom:1.5px solid var(--gold-soft);}
  .p-row{display:grid;grid-template-columns:36px 84px 1.3fr 1.3fr;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);}
  .p-row:last-child{border-bottom:none;}
  .p-row .p-num{font-family:'Fraunces',serif;font-weight:600;font-size:15px;color:var(--forest);}
  .p-row .p-time{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);}
  .p-row .p-class .p-subj{font-weight:700;font-size:13.5px;}
  .p-row .p-class .p-grade{font-size:11.5px;color:var(--ink-soft);}
  .p-row .p-subteacher{font-size:13.5px;font-weight:600;}
  .p-row .p-subteacher.covered{color:var(--forest);}
  .p-row .p-subteacher.uncovered{color:var(--coral);font-style:italic;font-weight:600;}
  #planCard .p-foot{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line);font-size:11px;color:var(--ink-soft);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;}


</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div>
      <h1>Registro de Sustituciones</h1>
      <div class="subtitle">Liceo · 4to, 5to y 6to grado · 30 profesores</div>
    </div>
    <div class="today" id="todayLabel"></div>
  </div>

  <div class="controls">
    <div class="controls-grid">
      <div class="field">
        <label>Día</label>
        <div class="day-tabs" id="dayTabs"></div>
      </div>
      <div class="field add-row">
        <div class="field">
          <label for="teacherSelect">Agregar profesor(a) ausente</label>
          <div class="select-wrap">
            <select id="teacherSelect"><option value="">Seleccionar profesor...</option></select>
          </div>
        </div>
        <button class="btn btn-primary" id="addAbsentBtn">+ Agregar</button>
      </div>
    </div>
    <div class="chips" id="absentChips"></div>
  </div>

  <div class="toolbar" id="toolbar" style="display:none;">
    <button class="btn btn-gold" id="autoAssignBtn">⚡ Auto-asignar sustitutos</button>
    <button class="btn btn-secondary" id="clearBtn">Limpiar asignaciones</button>
  </div>

  <div id="content">
    <div class="empty">
      <div class="glyph">✎</div>
      <p>Selecciona el día y agrega uno o más profesores ausentes. Podrás elegir el sustituto para cada período o dejar que la app lo asigne automáticamente.</p>
    </div>
  </div>

  <div id="planWrap" style="display:none;">
    <div class="section-divider"><h2>Plan de sustitución del día</h2><div class="line"></div></div>
    <div class="export-bar">
      <button class="btn btn-primary" id="downloadPlanBtn">⬇ Descargar plan completo (imagen)</button>
    </div>
    <div id="planCard"></div>

    <div class="section-divider"><h2>Envío individual</h2><div class="line"></div></div>
    <div class="individual-picker">
      <label for="individualSelect">Sustituto:</label>
      <div class="select-wrap" style="flex:1;max-width:280px;">
        <select id="individualSelect"></select>
      </div>
      <button class="btn btn-secondary" id="downloadIndividualBtn">⬇ Descargar tarjeta individual</button>
    </div>
  </div>

</div>

const DAYS = ["Lunes","Martes","Miércoles","Jueves","Viernes"];
const PERIODS = ["1","2","3","4","5","6"];
const TIMES = {"1":"8:00 – 8:45","2":"8:45 – 9:30","3":"9:30 – 10:15","4":"10:30 – 11:10","5":"11:10 – 11:50","6":"11:50 – 12:30"};

const teacherNames = Object.keys(SCHEDULE).sort((a,b)=>a.localeCompare(b,'es'));

function toTitle(s){ return s.toLowerCase().split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' '); }
function slug(s){ return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,''); }

// ---------- state ----------
let selectedDay = null;
let absentTeachers = [];              // array of names, in order added
let assignments = {};                 // key `${teacher}__${period}` -> substitute name

// ---------- setup: teacher select ----------
const teacherSelect = document.getElementById('teacherSelect');
function refreshTeacherOptions(){
  teacherSelect.innerHTML = '<option value="">Seleccionar profesor...</option>';
  teacherNames.filter(n=>!absentTeachers.includes(n)).forEach(n=>{
    const opt = document.createElement('option');
    opt.value = n; opt.textContent = toTitle(n);
    teacherSelect.appendChild(opt);
  });
}
refreshTeacherOptions();

document.getElementById('addAbsentBtn').addEventListener('click', ()=>{
  const v = teacherSelect.value;
  if(!v || absentTeachers.includes(v)) return;
  absentTeachers.push(v);
  refreshTeacherOptions();
  renderAll();
});

// ---------- day tabs ----------
const dayTabsEl = document.getElementById('dayTabs');
const todayIdx = new Date().getDay();
const dayDefaultIdx = (todayIdx>=1 && todayIdx<=5) ? todayIdx-1 : 0;
DAYS.forEach((d,i)=>{
  const el = document.createElement('div');
  el.className = 'day-tab' + (i===dayDefaultIdx ? ' active':'');
  el.textContent = d.slice(0,3);
  el.dataset.day = d;
  el.addEventListener('click', ()=>{
    document.querySelectorAll('.day-tab').forEach(t=>t.classList.remove('active'));
    el.classList.add('active');
    selectedDay = d;
    assignments = {};
    renderAll();
  });
  dayTabsEl.appendChild(el);
});
selectedDay = DAYS[dayDefaultIdx];

const monthNames = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const dayNamesFull = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const now = new Date();
document.getElementById('todayLabel').textContent = dayNamesFull[now.getDay()] + " " + now.getDate() + " de " + monthNames[now.getMonth()];

document.getElementById('clearBtn').addEventListener('click', ()=>{ assignments = {}; renderAll(); });

function freePeriodsOfDay(teacher, day){
  const sched = SCHEDULE[teacher][day];
  return PERIODS.filter(p => sched[p] === null);
}

function isDoubleBlock(teacher, day, p){
  const sched = SCHEDULE[teacher][day];
  const cell = sched[p];
  if(!cell) return false;
  const idx = PERIODS.indexOf(p);
  const prev = idx>0 ? sched[PERIODS[idx-1]] : null;
  const next = idx<PERIODS.length-1 ? sched[PERIODS[idx+1]] : null;
  const sameAs = c => c && c.subject===cell.subject && c.class===cell.class;
  return sameAs(prev) || sameAs(next);
}

function usedSubstitutesSet(){
  return new Set(Object.values(assignments));
}
function occupiedAtPeriod(period){
  const occ = new Set();
  Object.keys(assignments).forEach(key=>{
    const p = key.split('__')[1];
    if(p===period) occ.add(assignments[key]);
  });
  return occ;
}

// candidates free at (day, period), excluding absent teachers and anyone already
// placed in that exact period for another absent teacher. Flags whether already
// used elsewhere (different period) that day, so it can be de-prioritized.
function findSubstitutes(day, period){
  const absentSet = new Set(absentTeachers);
  const occ = occupiedAtPeriod(period);
  const used = usedSubstitutesSet();
  const list = [];
  for(const name of teacherNames){
    if(absentSet.has(name)) continue;
    if(occ.has(name)) continue;
    const cell = SCHEDULE[name][day][period];
    if(cell === null){
      const freeCount = freePeriodsOfDay(name, day).length;
      list.push({name, freeCount, usedElsewhere: used.has(name)});
    }
  }
  list.sort((a,b)=>{
    if(a.usedElsewhere !== b.usedElsewhere) return a.usedElsewhere ? 1 : -1;
    if(b.freeCount !== a.freeCount) return b.freeCount - a.freeCount;
    return a.name.localeCompare(b.name,'es');
  });
  return list;
}

function availColor(freeCount){
  if(freeCount>=4) return 'var(--free-3)';
  if(freeCount>=2) return 'var(--free-2)';
  return 'var(--free-1)';
}

// ---------- auto-assign ----------
function autoAssign(){
  const requests = [];
  absentTeachers.forEach(t=>{
    const sched = SCHEDULE[t][selectedDay];
    PERIODS.forEach(p=>{
      if(sched[p] !== null && !assignments[`${t}__${p}`]){
        requests.push({teacher:t, period:p});
      }
    });
  });
  // most constrained first: fewer available candidates -> assign first
  requests.forEach(r=> r._count = findSubstitutes(selectedDay, r.period).length );
  requests.sort((a,b)=> a._count - b._count || a.period.localeCompare(b.period));

  requests.forEach(r=>{
    const candidates = findSubstitutes(selectedDay, r.period);
    if(candidates.length === 0) return; // no one available at all
    // unused-first already sorted by findSubstitutes; pick top
    assignments[`${r.teacher}__${r.period}`] = candidates[0].name;
  });
  renderAll();
}
document.getElementById('autoAssignBtn').addEventListener('click', autoAssign);

// ---------- chips ----------
function renderChips(){
  const wrap = document.getElementById('absentChips');
  wrap.innerHTML = absentTeachers.map(t=>{
    const busy = PERIODS.filter(p=>SCHEDULE[t][selectedDay][p]!==null);
    const covered = busy.filter(p=>assignments[`${t}__${p}`]).length;
    return `<div class="chip" data-t="${t}">
      <span>${toTitle(t)}</span>
      <span class="cov">${covered}/${busy.length}</span>
      <span class="x" data-remove="${t}">✕</span>
    </div>`;
  }).join('');
  wrap.querySelectorAll('[data-remove]').forEach(x=>{
    x.addEventListener('click', ()=>{
      const t = x.dataset.remove;
      absentTeachers = absentTeachers.filter(n=>n!==t);
      Object.keys(assignments).forEach(k=>{ if(k.startsWith(t+'__')) delete assignments[k]; });
      refreshTeacherOptions();
      renderAll();
    });
  });
}

// ---------- main content (per-teacher schedule blocks) ----------
function renderContent(){
  const content = document.getElementById('content');
  const toolbar = document.getElementById('toolbar');

  if(absentTeachers.length === 0){
    content.innerHTML = `<div class="empty"><div class="glyph">✎</div>
      <p>Selecciona el día y agrega uno o más profesores ausentes. Podrás elegir el sustituto para cada período o dejar que la app lo asigne automáticamente.</p></div>`;
    toolbar.style.display = 'none';
    return;
  }
  toolbar.style.display = 'flex';

  let html = '';
  absentTeachers.forEach(teacher=>{
    const daySched = SCHEDULE[teacher][selectedDay];
    const busy = PERIODS.filter(p=>daySched[p]!==null);
    const covered = busy.filter(p=>assignments[`${teacher}__${p}`]).length;

    html += `<div class="teacher-block" data-teacher="${teacher}">
      <div class="teacher-block-head">
        <div>
          <div class="name">${toTitle(teacher)}</div>
          <div class="meta">${selectedDay} · ${busy.length} hora${busy.length!==1?'s':''} por cubrir</div>
        </div>
        <div class="stat">${covered}/${busy.length} cubiertas</div>
      </div>
      <div class="periods">`;

    PERIODS.forEach(p=>{
      const cell = daySched[p];
      const isFree = cell === null;
      const assignedName = assignments[`${teacher}__${p}`];
      const dbl = !isFree && isDoubleBlock(teacher, selectedDay, p);
      html += `<div class="period-row ${isFree?'free':''} ${assignedName?'assigned':''}" data-period="${p}" data-teacher="${teacher}">
        <div class="period-head">
          <div class="period-num">${p}</div>
          <div class="period-time">${TIMES[p]}</div>
          <div class="period-info">
            ${isFree
              ? `<div class="subj">Libre</div><div class="cls">Sin clase asignada</div>`
              : `<div class="subj">${cell.subject}${dbl?'<span class="dbl">bloque doble</span>':''}</div><div class="cls">${cell.class}</div>`
            }
          </div>
          ${isFree ? '' : assignedName
              ? `<div class="free-badge assigned">${toTitle(assignedName)}</div>`
              : `<div class="free-badge pending">Requiere sustituto</div>`
          }
          <div class="chevron">▾</div>
        </div>
        <div class="sub-panel" id="panel-${teacher}-${p}"></div>
      </div>`;
      if(p==="3"){ html += `<div class="recess-row">Recreo · 10:15 – 10:30</div>`; }
    });

    html += `</div></div>`;
  });

  content.innerHTML = html;

  content.querySelectorAll('.period-row').forEach(row=>{
    const p = row.dataset.period;
    const teacher = row.dataset.teacher;
    row.querySelector('.period-head').addEventListener('click', ()=>{
      const wasOpen = row.classList.contains('open');
      content.querySelectorAll('.period-row.open').forEach(r=>r.classList.remove('open'));
      if(!wasOpen){
        row.classList.add('open');
        buildSubPanel(teacher, p);
      }
    });
  });
}

function buildSubPanel(teacher, p){
  const panel = document.getElementById(`panel-${teacher}-${p}`);
  const cell = SCHEDULE[teacher][selectedDay][p];
  if(cell === null){
    panel.innerHTML = `<div class="no-subs" style="color:var(--free-2)">Este período ya está libre para ${toTitle(teacher)}. No requiere sustituto.</div>`;
    return;
  }
  const currentPick = assignments[`${teacher}__${p}`];
  // include current pick as candidate even if it'd otherwise be excluded as "occupied at period"
  let subs = findSubstitutes(selectedDay, p);
  if(currentPick && !subs.find(s=>s.name===currentPick)){
    subs.unshift({name:currentPick, freeCount:freePeriodsOfDay(currentPick, selectedDay).length, usedElsewhere:false});
  }
  if(subs.length === 0){
    panel.innerHTML = `<h4>Sustitutos disponibles — ${selectedDay}, período ${p}</h4>
      <div class="no-subs">No hay profesores libres en este período. Considera reasignar entre secciones o cubrir con coordinación.</div>`;
    return;
  }
  panel.innerHTML = `<h4>Sustitutos disponibles — ${selectedDay}, período ${p} · ordenados por disponibilidad</h4>
    <div class="sub-list">
      ${subs.map((s,i)=>`
        <div class="sub-item ${currentPick===s.name?'picked':''} ${s.usedElsewhere?'used-elsewhere':''}">
          <div class="sub-rank">${i+1}</div>
          <div class="sub-name">${toTitle(s.name)}${s.usedElsewhere?'<span class="used-tag">Ya asignado hoy</span>':''}</div>
          <div class="avail-track"><div class="avail-fill" style="width:${(s.freeCount/6*100).toFixed(0)}%;background:${availColor(s.freeCount)}"></div></div>
          <div class="avail-count">${s.freeCount} libre${s.freeCount!==1?'s':''}/6</div>
          ${currentPick===s.name
            ? `<button class="pick-btn remove" data-name="${s.name}" data-period="${p}" data-teacher="${teacher}">Quitar</button>`
            : `<button class="pick-btn" data-name="${s.name}" data-period="${p}" data-teacher="${teacher}">Elegir</button>`
          }
        </div>
      `).join('')}
    </div>`;

  panel.querySelectorAll('.pick-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const per = btn.dataset.period, nm = btn.dataset.name, t = btn.dataset.teacher;
      const key = `${t}__${per}`;
      if(assignments[key] === nm){ delete assignments[key]; } else { assignments[key] = nm; }
      renderAll();
      const row = document.querySelector(`.period-row[data-period="${per}"][data-teacher="${t}"]`);
      if(row){ row.classList.add('open'); buildSubPanel(t, per); }
    });
  });
}

// ---------- plan del día (shareable) ----------
function renderPlan(){
  const planWrap = document.getElementById('planWrap');
  if(absentTeachers.length === 0){ planWrap.style.display='none'; return; }

  const anyBusy = absentTeachers.some(t=>PERIODS.some(p=>SCHEDULE[t][selectedDay][p]!==null));
  if(!anyBusy){ planWrap.style.display='none'; return; }
  planWrap.style.display = 'block';

  let totalBusy = 0, totalCovered = 0, sections = '';
  absentTeachers.forEach(teacher=>{
    const daySched = SCHEDULE[teacher][selectedDay];
    const busy = PERIODS.filter(p=>daySched[p]!==null);
    if(busy.length===0) return;
    let rows = '';
    busy.forEach(p=>{
      const cell = daySched[p];
      const sub = assignments[`${teacher}__${p}`];
      totalBusy++; if(sub) totalCovered++;
      rows += `<div class="p-row">
        <div class="p-num">${p}</div>
        <div class="p-time">${TIMES[p]}</div>
        <div class="p-class"><div class="p-subj">${cell.subject}</div><div class="p-grade">${cell.class}</div></div>
        <div class="p-subteacher ${sub?'covered':'uncovered'}">${sub?toTitle(sub):'Sin cubrir'}</div>
      </div>`;
    });
    sections += `<div class="p-teacher-section">
      <div class="p-teacher-name">${toTitle(teacher)}</div>
      ${rows}
    </div>`;
  });

  const allCovered = totalCovered === totalBusy;
  document.getElementById('planCard').innerHTML = `
    <div class="p-head">
      <div>
        <div class="p-title">Plan de Sustitución</div>
        <div class="p-sub">${selectedDay} · ${dayNamesFull[now.getDay()]==selectedDay.toLowerCase()?'':''}${absentTeachers.length} profesor${absentTeachers.length!==1?'es':''} ausente${absentTeachers.length!==1?'s':''}</div>
      </div>
      <div class="p-badge ${allCovered?'ok':''}">${totalCovered}/${totalBusy} cubiertas</div>
    </div>
    ${sections}
    <div class="p-foot">
      <span>Registro de Sustituciones — Liceo</span>
      <span>${allCovered ? 'Plan completo' : 'Pendiente por confirmar'}</span>
    </div>
  `;

  const individualSelect = document.getElementById('individualSelect');
  const subsWithAssignments = [...new Set(Object.values(assignments))].sort((a,b)=>a.localeCompare(b,'es'));
  individualSelect.innerHTML = subsWithAssignments.length
    ? subsWithAssignments.map(n=>`<option value="${n}">${toTitle(n)}</option>`).join('')
    : `<option value="">Aún no hay sustitutos asignados</option>`;
  document.getElementById('downloadIndividualBtn').disabled = subsWithAssignments.length === 0;
}

function renderAll(){
  renderChips();
  renderContent();
  renderPlan();
}
renderAll();

// ---------- export (pure Canvas 2D — no external library, no CORS issues) ----------
const PAL = {
  paper:'#F7F3EA', ink:'#1F2B24', inkSoft:'#5B6B60', line:'#DCD4C1',
  forest:'#2C4A3B', gold:'#C79A3C', goldSoft:'#EFDFB4', coral:'#BE5B4D', white:'#FFFFFF'
};
const SCALE = 2;
const SERIF = 'Georgia, "Times New Roman", serif';
const SANS = '-apple-system, "Segoe UI", Arial, sans-serif';
const MONO = '"Courier New", monospace';

function rr(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function ellipsize(ctx, text, maxWidth){
  if(ctx.measureText(text).width <= maxWidth) return text;
  let t = text;
  while(t.length>1 && ctx.measureText(t+'…').width > maxWidth){ t = t.slice(0,-1); }
  return t+'…';
}
function newCanvas(logicalW, logicalH){
  const canvas = document.createElement('canvas');
  canvas.width = logicalW*SCALE; canvas.height = logicalH*SCALE;
  const ctx = canvas.getContext('2d');
  ctx.scale(SCALE, SCALE);
  ctx.fillStyle = PAL.paper;
  ctx.fillRect(0,0,logicalW,logicalH);
  return {canvas, ctx};
}

function buildPlanRows(){
  const sections = [];
  let totalBusy=0, totalCovered=0;
  absentTeachers.forEach(teacher=>{
    const daySched = SCHEDULE[teacher][selectedDay];
    const busy = PERIODS.filter(p=>daySched[p]!==null);
    if(busy.length===0) return;
    const rows = busy.map(p=>{
      const cell = daySched[p];
      const sub = assignments[`${teacher}__${p}`];
      totalBusy++; if(sub) totalCovered++;
      return {p, time:TIMES[p], subject:cell.subject, cls:cell.class, sub};
    });
    sections.push({teacher, rows});
  });
  return {sections, totalBusy, totalCovered};
}

function drawPlanCanvas(){
  const W = 720;
  const PAD = 34;
  const {sections, totalBusy, totalCovered} = buildPlanRows();
  const rowH = 34, sectionTitleH = 30, sectionGap = 14;
  let bodyH = 0;
  sections.forEach(s=>{ bodyH += sectionTitleH + s.rows.length*rowH + sectionGap; });
  const headH = 78, footH = 48;
  const H = PAD*2 + headH + bodyH + footH;

  const {canvas, ctx} = newCanvas(W, H);
  let y = PAD;

  // header
  ctx.fillStyle = PAL.ink;
  ctx.font = '600 24px ' + SERIF;
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('Plan de Sustitución', PAD, y+26);

  ctx.font = '700 11px ' + SANS;
  ctx.fillStyle = PAL.inkSoft;
  const subLabel = `${selectedDay.toUpperCase()} · ${absentTeachers.length} PROFESOR${absentTeachers.length!==1?'ES':''} AUSENTE${absentTeachers.length!==1?'S':''}`;
  ctx.fillText(subLabel, PAD, y+46);

  // badge
  const allCovered = totalCovered===totalBusy;
  ctx.font = '700 12px ' + SANS;
  const badgeText = `${totalCovered}/${totalBusy} CUBIERTAS`;
  const badgeW = ctx.measureText(badgeText).width + 26;
  ctx.fillStyle = allCovered ? PAL.forest : PAL.coral;
  rr(ctx, W-PAD-badgeW, y+2, badgeW, 26, 13); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillText(badgeText, W-PAD-badgeW+13, y+19);

  y += headH - 20;
  ctx.strokeStyle = PAL.ink; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(PAD,y); ctx.lineTo(W-PAD,y); ctx.stroke();
  y += 24;

  // sections
  sections.forEach(sec=>{
    ctx.font = '600 15px ' + SERIF;
    ctx.fillStyle = PAL.forest;
    ctx.fillText(toTitle(sec.teacher), PAD, y+14);
    y += 8;
    ctx.strokeStyle = PAL.goldSoft; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(PAD,y+14); ctx.lineTo(W-PAD,y+14); ctx.stroke();
    y += sectionTitleH;

    sec.rows.forEach((r,i)=>{
      const rowY = y;
      // circle with period number
      ctx.fillStyle = PAL.forest;
      ctx.beginPath(); ctx.arc(PAD+11, rowY+11, 11, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = '700 12px ' + SANS; ctx.textAlign='center';
      ctx.fillText(r.p, PAD+11, rowY+15); ctx.textAlign='left';

      ctx.font = '600 11px ' + MONO; ctx.fillStyle = PAL.inkSoft;
      ctx.fillText(r.time, PAD+34, rowY+15);

      ctx.font = '700 13px ' + SANS; ctx.fillStyle = PAL.ink;
      const classX = PAD+150;
      ctx.fillText(ellipsize(ctx, r.subject, 150), classX, rowY+11);
      ctx.font = '400 11px ' + SANS; ctx.fillStyle = PAL.inkSoft;
      ctx.fillText(r.cls, classX, rowY+25);

      const subX = PAD+340;
      ctx.font = '600 13px ' + SANS;
      ctx.fillStyle = r.sub ? PAL.forest : PAL.coral;
      const subText = r.sub ? toTitle(r.sub) : 'Sin cubrir';
      ctx.fillText(ellipsize(ctx, subText, W-PAD-subX), subX, rowY+15);

      if(i < sec.rows.length-1){
        ctx.strokeStyle = PAL.line; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(PAD, rowY+rowH-4); ctx.lineTo(W-PAD, rowY+rowH-4); ctx.stroke();
      }
      y += rowH;
    });
    y += sectionGap;
  });

  // footer
  ctx.strokeStyle = PAL.line; ctx.lineWidth = 1; ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.moveTo(PAD,y); ctx.lineTo(W-PAD,y); ctx.stroke(); ctx.setLineDash([]);
  y += 20;
  ctx.font = '400 11px ' + SANS; ctx.fillStyle = PAL.inkSoft;
  ctx.fillText('Registro de Sustituciones — Liceo', PAD, y);
  ctx.textAlign = 'right';
  ctx.fillText(allCovered ? 'Plan completo' : 'Pendiente por confirmar', W-PAD, y);
  ctx.textAlign = 'left';

  return canvas;
}

function drawIndividualCanvas(subName){
  const rows = [];
  absentTeachers.forEach(teacher=>{
    const daySched = SCHEDULE[teacher][selectedDay];
    PERIODS.forEach(p=>{
      if(assignments[`${teacher}__${p}`] === subName){
        rows.push({p, time:TIMES[p], subject:daySched[p].subject, cls:daySched[p].class, forTeacher:teacher});
      }
    });
  });

  const W = 480, PAD = 30;
  const rowH = 56;
  const headH = 96, footH = 56;
  const H = PAD*2 + headH + rows.length*rowH + footH;
  const {canvas, ctx} = newCanvas(W, H);
  let y = PAD;

  ctx.font = '700 10.5px ' + SANS; ctx.fillStyle = PAL.gold;
  ctx.fillText('SUSTITUCIÓN ASIGNADA', PAD, y+10);
  y += 24;
  ctx.font = '600 24px ' + SERIF; ctx.fillStyle = PAL.ink;
  ctx.fillText(ellipsize(ctx, toTitle(subName), W-PAD*2), PAD, y+8);
  y += 22;
  ctx.font = '400 12px ' + SANS; ctx.fillStyle = PAL.inkSoft;
  ctx.fillText(`${selectedDay} · Horario de sustitución del día`, PAD, y+6);
  y += 24;

  rows.forEach((r,i)=>{
    const rowY = y;
    ctx.fillStyle = PAL.forest;
    ctx.beginPath(); ctx.arc(PAD+15, rowY+18, 15, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='700 16px '+SERIF; ctx.textAlign='center';
    ctx.fillText(r.p, PAD+15, rowY+23); ctx.textAlign='left';

    ctx.font='600 11px '+MONO; ctx.fillStyle=PAL.inkSoft;
    ctx.fillText(r.time, PAD+42, rowY+16);

    const infoX = PAD+130;
    ctx.font='700 14px '+SANS; ctx.fillStyle=PAL.ink;
    ctx.fillText(ellipsize(ctx, r.subject, W-PAD-infoX), infoX, rowY+11);
    ctx.font='400 11.5px '+SANS; ctx.fillStyle=PAL.inkSoft;
    ctx.fillText(r.cls, infoX, rowY+26);
    ctx.font='700 10.5px '+SANS; ctx.fillStyle=PAL.gold;
    ctx.fillText('POR AUSENCIA DE ' + toTitle(r.forTeacher).toUpperCase(), infoX, rowY+40);

    if(i < rows.length-1){
      ctx.strokeStyle = PAL.line; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(PAD, rowY+rowH-6); ctx.lineTo(W-PAD, rowY+rowH-6); ctx.stroke();
    }
    y += rowH;
  });

  y += 14;
  ctx.strokeStyle = PAL.line; ctx.lineWidth=1; ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.moveTo(PAD,y); ctx.lineTo(W-PAD,y); ctx.stroke(); ctx.setLineDash([]);
  y += 20;
  ctx.font='400 11px '+SANS; ctx.fillStyle=PAL.inkSoft;
  wrapText(ctx, 'Por favor confirma tu disponibilidad con coordinación académica. — Registro de Sustituciones', PAD, y, W-PAD*2, 15);

  return canvas;
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight){
  const words = text.split(' ');
  let line = '';
  words.forEach(w=>{
    const test = line + w + ' ';
    if(ctx.measureText(test).width > maxWidth && line){
      ctx.fillText(line, x, y); line = w+' '; y += lineHeight;
    } else { line = test; }
  });
  ctx.fillText(line, x, y);
}

function downloadCanvas(canvas, filename){
  canvas.toBlob(blob=>{
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.download = filename;
    link.href = url;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }, 'image/png');
}

document.getElementById('downloadPlanBtn').addEventListener('click', ()=>{
  try{
    const canvas = drawPlanCanvas();
    downloadCanvas(canvas, `plan_sustitucion_${slug(selectedDay)}.png`);
  }catch(err){
    console.error(err);
    alert('No se pudo generar la imagen. Detalle: ' + err.message);
  }
});

document.getElementById('downloadIndividualBtn').addEventListener('click', ()=>{
  const subName = document.getElementById('individualSelect').value;
  if(!subName) return;
  try{
    const canvas = drawIndividualCanvas(subName);
    downloadCanvas(canvas, `sustitucion_${slug(subName)}_${slug(selectedDay)}.png`);
  }catch(err){
    console.error(err);
    alert('No se pudo generar la imagen. Detalle: ' + err.message);
  }
});
